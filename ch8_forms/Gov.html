<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goverment Application Form</title>
    <style>
        body{
            font-family: arial; background: #eef;
            display: grid; border: 3px solid red;
        }
        h2{
            text-transform: uppercase;
            text-align: center;
            text-decoration: underline;
            color: red;
            
        }
        form{
            width: 400px; margin: 40px auto;
            background: white; padding: 20px;
            
            

        }
        input, select{
            width: 100px; margin: 8px 0;
            padding: 8px;
            border: 2px solid green;
        }
        button{
            background: blue;
            color: white; padding: 10px; border: none;
        }

    </style>
</head>
<body>
    <h2>Goverment Form</h2>
    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="National ID Number">
    <select>
        <option>Gender</option>
        <option>Male</option>
        <option>Female</option>
    </select>
    <input type="text" placeholder="County">
    <input type="text" placeholder="Sub-county">
    <select>
        <option>Disability</option>
        <option>No</option>
        <option>Yes</option>
    </select>
    <button>Submit</button>
    
</body>
</html>
