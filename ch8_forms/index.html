<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job/Intership Application</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <h2>Job / Intership Application</h2>

      <input type="text" placeholder="Full Name" required />
      <input type="date" placeholder="Date of Birth" required />
      <input type="tel" placeholder="Phone Number" required />
      <input type="email" placeholder="Email" required />

      <select>
        <option>Postion Applied For</option>
        <option>Intership</option>
        <option>Job</option>
      </select>
      <textarea placeholder="skills" required></textarea>
      <textarea placeholder="Work Experience" required></textarea>

      <button type="submit">submit</button>
    </form>
  </body>
</html>
