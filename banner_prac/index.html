<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profplanet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <nav class="nav">
        <img src="logo.png" class="logo" alt="Profplanet Logo" />
      </nav>

      <div class="hero">
        <h1>MASTER MODERN TOOLS</h1>
        <p>Build Career-Ready Tech Skills</p>
        <button onclick="joinNow()">Join Now</button>
      </div>
    </header>

    <!-- PROGRAMS -->
    <section class="programs">
      <h2>Current Programs</h2>

      <div class="cards">
        <div class="card">
          <img src="cyber.jpg" />
          <h3>Cyber Security</h3>
        </div>

        <div class="card">
          <img src="data.jpg" />
          <h3>Data Science</h3>
        </div>

        <div class="card">
          <img src="software.jpg" />
          <h3>Software Engineering</h3>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p>Email: info@profplanet.com</p>
      <p>Phone: +254 759 111 516</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
